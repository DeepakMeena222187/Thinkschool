<div class="shell">
  <a routerLink="/create" class="skip-link">Skip to Create Quote form</a>

  <div class="topbar">
    <div class="brand-block">
      <h1 class="brand">Quote Search</h1>
      <p class="tagline">Collect the words worth keeping.</p>
    </div>

    <nav class="main-nav" aria-label="Primary">
      <a routerLink="/search" routerLinkActive="main-nav__link--active" class="main-nav__link">Search</a>
      <a routerLink="/collections" routerLinkActive="main-nav__link--active" class="main-nav__link">Collections</a>
      <a routerLink="/create" routerLinkActive="main-nav__link--active" class="main-nav__link">Create</a>
      <a routerLink="/quotes" routerLinkActive="main-nav__link--active" class="main-nav__link">Quotes (Day 16)</a>
    </nav>

    @if (!isLoginRoute()) {
      <app-login />
    }
  </div>

  <div class="hero-decoration" aria-hidden="true">
    <span class="giant-quote">&rdquo;</span>
    <div class="blob blob--one"></div>
    <div class="blob blob--two"></div>
    <div class="blob blob--three"></div>
  </div>

  <section class="task2-section">
    <router-outlet />
  </section>
</div>
